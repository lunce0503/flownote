name: Web checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn lint
      - run: yarn build
